name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


jobs:
  build:
    permissions:
      contents: write

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get Version from Info.plist
      id: get_version
      run: |
        VERSION=$(grep -A 1 'CFBundleShortVersionString' Sources/Info.plist | grep string | sed -E 's/<[^>]+>//g' | tr -d ' \t')
        echo "Extracted version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Cache PJSIP libraries
      id: pjsip-cache
      uses: actions/cache@v4
      with:
        path: |
          Vendor/pjproject/pjsip/lib
          Vendor/pjproject/pjmedia/lib
          Vendor/pjproject/pjnath/lib
          Vendor/pjproject/pjlib-util/lib
          Vendor/pjproject/pjlib/lib
          Vendor/pjproject/third_party/lib
          Vendor/pjproject/.codex-local-build-stamp
        key: pjsip-${{ runner.os }}-${{ hashFiles('Vendor/pjproject/VERSION', 'Vendor/pjproject/configure') }}

    - name: Build PJSIP
      if: steps.pjsip-cache.outputs.cache-hit != 'true'
      run: |
        cd Vendor/pjproject
        make distclean >/dev/null 2>&1 || true
        export MACOSX_DEPLOYMENT_TARGET=13.0
        ./configure \
          --disable-video \
          --disable-sdl \
          --disable-ffmpeg \
          --disable-openh264 \
          --disable-vpx \
          --prefix="$(pwd)/install"
        make EXCLUDE_APP=1 dep
        make EXCLUDE_APP=1 -j$(sysctl -n hw.ncpu)
        touch .codex-local-build-stamp

    - name: Create PJSIP generic symlinks
      run: |
        for dir in \
          Vendor/pjproject/pjsip/lib \
          Vendor/pjproject/pjmedia/lib \
          Vendor/pjproject/pjnath/lib \
          Vendor/pjproject/pjlib-util/lib \
          Vendor/pjproject/pjlib/lib \
          Vendor/pjproject/third_party/lib; do
          for lib in "$dir"/*-aarch64-apple-darwin*.a; do
            [[ -e "$lib" ]] || continue
            base="$(basename "$lib")"
            generic="${base%%-aarch64-apple-darwin*}.a"
            ln -sf "$base" "$dir/$generic" || true
          done
        done

    - name: Set up code signing
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

    - name: Build and Package App
      run: |
        APP_NAME="SipTray"
        BUNDLE_DIR="${APP_NAME}.app"

        rm -rf "$BUNDLE_DIR"
        mkdir -p "$BUNDLE_DIR/Contents/MacOS" "$BUNDLE_DIR/Contents/Resources" "$BUNDLE_DIR/Contents/Frameworks"

        echo "Building for arm64..."
        MACOSX_DEPLOYMENT_TARGET=13.0 swift build -c release --arch arm64

        cp .build/arm64-apple-macosx/release/SipTray "$BUNDLE_DIR/Contents/MacOS/SipTray"
        chmod +x "$BUNDLE_DIR/Contents/MacOS/SipTray"

        # Generate app icon
        /usr/bin/swift - ".build/SipTray-1024.png" <<'SWIFT'
import AppKit
let outputPath = CommandLine.arguments[1]
let size = NSSize(width: 1024, height: 1024)
let image = NSImage(size: size)
image.lockFocus()
let rect = NSRect(origin: .zero, size: size)
NSColor(calibratedRed: 0.07, green: 0.11, blue: 0.16, alpha: 1).setFill()
NSBezierPath(roundedRect: rect, xRadius: 220, yRadius: 220).fill()
let circleRect = NSRect(x: 112, y: 112, width: 800, height: 800)
NSColor(calibratedRed: 0.18, green: 0.70, blue: 0.43, alpha: 1).setFill()
NSBezierPath(ovalIn: circleRect).fill()
let config = NSImage.SymbolConfiguration(pointSize: 430, weight: .black)
if let symbol = NSImage(systemSymbolName: "phone.fill", accessibilityDescription: nil)?
    .withSymbolConfiguration(config) {
    let symbolRect = NSRect(x: 260, y: 260, width: 504, height: 504)
    symbol.draw(in: symbolRect, from: .zero, operation: .sourceOver, fraction: 1)
}
NSColor.systemRed.setFill()
NSBezierPath(ovalIn: NSRect(x: 714, y: 714, width: 170, height: 170)).fill()
image.unlockFocus()
guard let tiff = image.tiffRepresentation,
      let rep = NSBitmapImageRep(data: tiff),
      let png = rep.representation(using: .png, properties: [:])
else { exit(1) }
try png.write(to: URL(fileURLWithPath: outputPath))
SWIFT

        mkdir -p .build/SipTray.iconset
        cp .build/SipTray-1024.png .build/SipTray.iconset/icon_512x512@2x.png
        sips -z 512 512 .build/SipTray-1024.png --out .build/SipTray.iconset/icon_512x512.png >/dev/null
        sips -z 256 256 .build/SipTray-1024.png --out .build/SipTray.iconset/icon_256x256.png >/dev/null
        sips -z 256 256 .build/SipTray-1024.png --out .build/SipTray.iconset/icon_256x256@2x.png >/dev/null
        sips -z 128 128 .build/SipTray-1024.png --out .build/SipTray.iconset/icon_128x128.png >/dev/null
        sips -z 256 256 .build/SipTray-1024.png --out .build/SipTray.iconset/icon_128x128@2x.png >/dev/null
        sips -z 32 32  .build/SipTray-1024.png --out .build/SipTray.iconset/icon_32x32.png   >/dev/null
        sips -z 64 64  .build/SipTray-1024.png --out .build/SipTray.iconset/icon_32x32@2x.png >/dev/null
        sips -z 16 16  .build/SipTray-1024.png --out .build/SipTray.iconset/icon_16x16.png   >/dev/null
        sips -z 32 32  .build/SipTray-1024.png --out .build/SipTray.iconset/icon_16x16@2x.png >/dev/null
        iconutil -c icns .build/SipTray.iconset -o "$BUNDLE_DIR/Contents/Resources/SipTray.icns"

        cp Sources/Info.plist "$BUNDLE_DIR/Contents/Info.plist"
        echo "APPL????" > "$BUNDLE_DIR/Contents/PkgInfo"

        # Copy and configure Sparkle framework
        SPARKLE_PATH=$(find .build -name "Sparkle.framework" -type d | head -n 1)
        if [ -z "$SPARKLE_PATH" ]; then
          echo "❌ Error: Sparkle framework not found"
          exit 1
        fi
        ditto --rsrc "$SPARKLE_PATH" "$BUNDLE_DIR/Contents/Frameworks/Sparkle.framework"

        # Update install name
        install_name_tool -change "@rpath/Sparkle.framework/Versions/B/Sparkle" \
          "@executable_path/../Frameworks/Sparkle.framework/Versions/B/Sparkle" \
          "$BUNDLE_DIR/Contents/MacOS/SipTray"

        # Sign Sparkle framework
        codesign --force \
          --options runtime \
          --sign "Developer ID Application: LimTec GmbH (${{ secrets.TEAM_ID }})" \
          --timestamp \
          --deep \
          "$BUNDLE_DIR/Contents/Frameworks/Sparkle.framework"

        # Sign with hardened runtime and entitlements
        codesign --force \
          --options runtime \
          --entitlements Sources/SipTray.entitlements \
          --sign "Developer ID Application: LimTec GmbH (${{ secrets.TEAM_ID }})" \
          --timestamp \
          --deep \
          --strict \
          --verbose \
          "$BUNDLE_DIR"

        codesign -vv --deep --strict "$BUNDLE_DIR"

        # Create initial zip for notarization
        ditto -c -k --keepParent "$BUNDLE_DIR" SipTray.zip

    - name: Notarize App
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: |
        echo "$ASC_KEY_CONTENT" > AuthKey.p8

        xcrun notarytool submit SipTray.zip \
          --key AuthKey.p8 \
          --key-id "$ASC_KEY_ID" \
          --issuer "$ASC_ISSUER_ID" \
          --wait \
          --timeout 30m

        xcrun stapler staple SipTray.app

        # Create final ZIP
        ditto -c -k --keepParent SipTray.app SipTray_final.zip

        # Create and notarize DMG
        mkdir -p dmg_root
        cp -R SipTray.app dmg_root/
        ln -s /Applications dmg_root/Applications

        hdiutil create -volname "SipTray" \
          -srcfolder dmg_root \
          -ov \
          -format UDZO \
          -fs HFS+ \
          -imagekey zlib-level=9 \
          SipTray_final.dmg

        codesign --force \
          --sign "Developer ID Application: LimTec GmbH (${{ secrets.TEAM_ID }})" \
          --options runtime \
          --timestamp \
          --verbose \
          SipTray_final.dmg

        xcrun notarytool submit SipTray_final.dmg \
          --key AuthKey.p8 \
          --key-id "$ASC_KEY_ID" \
          --issuer "$ASC_ISSUER_ID" \
          --wait \
          --timeout 30m

        xcrun stapler staple SipTray_final.dmg

        spctl --assess -vv --type install SipTray_final.dmg

    - name: Generate Appcast
      env:
        SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
      run: |
        mkdir -p release
        cp SipTray_final.zip release/

        SPARKLE_BIN=".build/artifacts/sparkle/Sparkle/bin"
        if [ ! -f "$SPARKLE_BIN/generate_appcast" ]; then
          echo "❌ Error: Sparkle tools not found in $SPARKLE_BIN"
          exit 1
        fi

        "$SPARKLE_BIN/generate_appcast" \
          --download-url-prefix "https://github.com/LimTec-de/SipTray/releases/download/v${{ env.VERSION }}/" \
          --ed-key-file - \
          release <<< "$SPARKLE_KEY"

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ env.VERSION }}" \
          --title "SipTray v${{ env.VERSION }}" \
          --draft \
          SipTray_final.zip \
          SipTray_final.dmg \
          release/appcast.xml
